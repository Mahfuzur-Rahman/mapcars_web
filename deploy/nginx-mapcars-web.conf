# Nginx site for the Mapcars web app — copy to /etc/nginx/sites-available/mapcars-web
# on the GCE VM and symlink into sites-enabled/. Sits alongside the existing
# `mapcars-api` site (gce-test.mapcars.uk); the two don't interact.
#
# This is the PRE-CERTBOT version: port 80 only. `certbot --nginx -d mapcars.uk
# -d www.mapcars.uk` rewrites this file in place — it adds the `listen 443 ssl`
# directives, the certificate paths, and the HTTP→HTTPS redirect. Don't hand-write
# those; let certbot own them so renewals keep working.

# ── Canonical host: mapcars.uk ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mapcars.uk;

    # Driver/rider document uploads and admin poster images all POST through the
    # BFF's multipart proxy (proxyAuthedUpload). Nginx defaults to 1 MB, which
    # would 413 a phone photo of a driving licence before it ever reaches the API.
    client_max_body_size 25M;

    # The retired static GitHub Pages site had exactly one other indexed URL;
    # preserve it rather than serving a 404 to anything already linking it.
    location = /privacy.html {
        return 301 /legal/privacy;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The App Router streams server-rendered HTML. Buffering it would hold the
        # whole response back and throw away the benefit of streaming SSR.
        proxy_buffering off;

        # Don't cut off a slow upstream render mid-flight.
        proxy_read_timeout 60s;
    }
}

# ── www → apex ────────────────────────────────────────────────────────────────
# Not cosmetic: session cookies (mc_admin / mc_rider / mc_driver) are host-scoped,
# so a user who signs in on www and is then sent to the apex — or vice versa —
# arrives with no cookie and looks signed out. Collapsing to one canonical origin
# removes that class of bug entirely.
server {
    listen 80;
    listen [::]:80;
    server_name www.mapcars.uk;

    # $scheme, not a hardcoded https://, so this also works during the brief
    # HTTP-only window between the DNS cutover and certbot issuing the cert.
    return 301 $scheme://mapcars.uk$request_uri;
}
