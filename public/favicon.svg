<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#22D3EE" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded badge container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#22D3EE" stroke-width="14" stroke-opacity="0.6" />

  <!-- Bold MapCars Pin & Motion Shield -->
  <path d="M256 64 C165 64 96 136 96 226 C96 326 214 424 246 450 C252 455 260 455 266 450 C298 424 416 326 416 226 C416 136 347 64 256 64 Z" fill="url(#cyan)" />

  <!-- Dark Inner Contrast Core -->
  <circle cx="256" cy="222" r="92" fill="#0B1120" />

  <!-- Stylized 'M' Speed Waves -->
